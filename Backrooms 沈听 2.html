<style>
/* Layout: full-bleed 3D view; HUD pinned to the edges; menu as a dim panel over the first corridor. */

}

  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen[hidden]{display:none}
.panel{width:min(880px,100%);background:var(--panel);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* HUD */

  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.inv{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}

.cell{aspect-ratio:1/1;min-height:70px;background:rgba(0,0,0,.4);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-size:12.5px;text-align:center;min-width:0}

.detail{min-height:92px;border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}

.screen{align-items:flex-start}.panel{margin:auto}

body.touch #vf{inset:5px}
#hud::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);pointer-events:none}
#rec{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--tape);text-shadow:0 1px 3px #000;letter-spacing:.08em}
#rec i{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:recblink 1.1s steps(2) infinite}
#rec b{font-weight:500;font-variant-numeric:tabular-nums}
@keyframes recblink{50%{opacity:.15}}
#mpHud{top:40px}
.bar .track{height:10px;border:0;background:rgba(0,0,0,.62);position:relative;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.6) 9px 11px)}
.bar span:first-child{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--tape)}
.slot{clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));border-color:rgba(232,220,174,.35)}
.slot.on{box-shadow:none;background:rgba(80,62,12,.8);border-color:var(--accent)}
#prompt{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));font-family:var(--mono)}
#msgs div{font-family:var(--mono);font-size:12.5px}
@media (max-width:640px){.menu2>*{margin-inline:14px}.slatebody{padding:12px 14px}.clsbtn img{width:52px;height:52px}}
#emoScreen .panel{max-width:540px;width:calc(100vw - 32px)}
#emoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.emb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--fg);cursor:pointer;font:inherit;font-size:12px;min-width:0}
.emb span{font-size:24px;line-height:1.1;font-family:system-ui,'Segoe UI Emoji','Apple Color Emoji',sans-serif}
.emb b{font-weight:600;text-align:center;word-break:keep-all}
.emb:hover,.emb:focus-visible{border-color:var(--accent);background:rgba(241,200,75,.12);outline:none}
.emhint{font-size:12px;opacity:.7;margin:0 0 8px}
@media(max-width:480px){#emoGrid{grid-template-columns:repeat(3,1fr)}}
#tbEmo{width:44px;height:44px;right:calc(var(--rg) + 104px);top:calc(var(--tg) + 62px);font-size:20px}
</style>

function genMaze(lp,rc){
 var g=[],z,x;for(z=0;z<W;z++){g.push([]);for(x=0;x<W;x++)g[z].push(1);}
 var vis=[];for(z=0;z<N;z++){vis.push([]);for(x=0;x<N;x++)vis[z].push(false);}
 var st=[[0,0]];vis[0][0]=true;g[1][1]=0;
 while(st.length){
  var cur=st[st.length-1],cx=cur[0],cz=cur[1],nb=[];
  D4.forEach(function(d){var nx=cx+d[0],nz=cz+d[1];if(nx>=0&&nz>=0&&nx<N&&nz<N&&!vis[nz][nx])nb.push([nx,nz,d[0],d[1]]);});
  if(!nb.length){st.pop();continue;}
  var c=nb[Math.floor(Math.random()*nb.length)];
  vis[c[1]][c[0]]=true;g[2*c[1]+1][2*c[0]+1]=0;g[2*cz+1+c[3]][2*cx+1+c[2]]=0;st.push([c[0],c[1]]);
 }
 for(z=1;z<W-1;z++)for(x=1;x<W-1;x++){if(g[z][x]===1&&((x%2===0)!==(z%2===0))&&Math.random()<lp)g[z][x]=0;}
 for(var k=0;k<rc;k++){var rx=3+2*Math.floor(Math.random()*(N-3)),rz=3+2*Math.floor(Math.random()*(N-3));
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++)g[rz+a][rx+b]=0;}
 return g;
}
function solid(x,z){var gx=Math.floor(x/T),gz=Math.floor(z/T);return gx<0||gz<0||gx>=W||gz>=W||grid[gz][gx]!==0;}
function hitBox(x,z,r){return solid(x-r,z-r)||solid(x+r,z-r)||solid(x-r,z+r)||solid(x+r,z+r);}
function bfs(sx,sz){
 var d=[],z,x;for(z=0;z<W;z++){d.push([]);for(x=0;x<W;x++)d[z].push(-1);}
 var q=[[sx,sz]];d[sz][sx]=0;
 for(var i=0;i<q.length;i++){var c=q[i];for(var j=0;j<4;j++){var nx=c[0]+D4[j][0],nz=c[1]+D4[j][1];
  if(nx>=0&&nz>=0&&nx<W&&nz<W&&grid[nz][nx]===0&&d[nz][nx]<0){d[nz][nx]=d[c[1]][c[0]]+1;q.push([nx,nz]);}}}
 return d;
}
function nextStep(sx,sz,tx,tz){
 var d=bfs(tx,tz),bv=d[sz][sx],best=null;if(bv<0)return null;
 for(var j=0;j<4;j++){var nx=sx+D4[j][0],nz=sz+D4[j][1];
  if(nx>=0&&nz>=0&&nx<W&&nz<W&&d[nz][nx]>=0&&d[nz][nx]<bv){bv=d[nz][nx];best=[nx,nz];}}
 return best;
}

var ac=null,humG=null,wg=null;

  o1.connect(f);o2.connect(f);f.connect(g);g.connect(ac.destination);o1.start();o2.start();humG=g;
  var nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),nd=nb.getChannelData(0);for(var q=0;q<nd.length;q++)nd[q]=Math.random()*2-1;
  var ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;var bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=4;wg=ac.createGain();wg.gain.value=0;ns.connect(bp);bp.connect(wg);wg.connect(ac.destination);ns.start();

function count(id){var c=0;inv.forEach(function(s){if(s.id===id)c+=s.qty;});return c;}
function freeSlot(){for(var k=0;k<CAP;k++){var u=false;for(var j=0;j<inv.length;j++)if(inv[j].s===k){u=true;break;}if(!u)return k;}return -1;}
function stackAt(k){for(var j=0;j<inv.length;j++)if(inv[j].s===k)return inv[j];return null;}
function addItem(id,q){
 if(ITEMS[id].type!=='weapon'){for(var i=0;i<inv.length;i++)if(inv[i].id===id){inv[i].qty+=q;return true;}}
 var fs=freeSlot();if(fs<0)return false;
 inv.push({id:id,qty:q,s:fs});return true;
}
function removeAt(i,q){inv[i].qty-=q;if(inv[i].qty<=0)inv.splice(i,1);}
function moveSlot(a,b){
 var A=stackAt(a),B=stackAt(b);if(!A||a===b)return;
 if(!B)A.s=b;
 else if(B.id===A.id&&ITEMS[A.id].type!=='weapon'&&ITEMS[A.id].type!=='admin'){B.qty+=A.qty;inv.splice(inv.indexOf(A),1);}
 else{B.s=a;A.s=b;}
}
function syncHeld(){if(!P)return;var h=stackAt(hbSel);P.weapon=(h&&ITEMS[h.id].type==='weapon')?h.id:null;}
function useHeld(){
 if(!P||state!=='play')return;var h=stackAt(hbSel);if(!h)return;var ty=ITEMS[h.id].type;
 if(ty==='use'||ty==='admin'){P.atkCd=0.4;P.swing=0.8;useItem(inv.indexOf(h));}
}
function cycleWeapon(){for(var i=1;i<=9;i++){var k=(hbSel+i)%9,st=stackAt(k);if(st&&ITEMS[st.id].type==='weapon'){hbSel=k;return;}}}
function take(id){for(var i=0;i<inv.length;i++)if(inv[i].id===id){removeAt(i,1);return true;}return false;}
function useItem(i){
 var it=inv[i];if(!it)return;
 if(it.id==='almond'){P.hp=Math.min(P.maxHp,P.hp+15);P.stam=Math.min(P.maxStam,P.stam+50);removeAt(i,1);msg(t('healed'));beep(520,.12,'sine',.05);}
 else if(it.id==='bandage'){P.hp=Math.min(P.maxHp,P.hp+30);removeAt(i,1);msg(t('healed'));beep(440,.12,'sine',.05);}
 else if(it.id==='battery'){P.bat=Math.min(100,P.bat+60);removeAt(i,1);beep(660,.1,'sine',.05);}
 else if(it.id==='medkit'){P.hp=Math.min(P.maxHp,P.hp+60);removeAt(i,1);msg(t('healed'));beep(480,.15,'sine',.05);}
 else if(it.id==='energy'){P.stam=P.maxStam;P.exhausted=false;P.dashUntil=performance.now()/1000+5;removeAt(i,1);msg(t('dashMsg'));beep(700,.15,'sawtooth',.04);}
 else if(it.id==='flare'||it.id==='smoke'){
  var fxv=-Math.sin(P.yaw),fzv=-Math.cos(P.yaw),sm=it.id==='smoke';
  fx(sm?'#9aa0a8':'#ff8a50',0.6,0.9);burst(.2,.2);beep(sm?200:1600,.2,sm?'sawtooth':'square',.05);msg(t('flashMsg'));
  enemies.forEach(function(en){var dx=en.x-P.x,dz=en.z-P.z,d=Math.hypot(dx,dz);if(sm?d<8:(d<14&&d>0&&(dx*fxv+dz*fzv)/d>0.3))en.stun=sm?3.5:3;});
  removeAt(i,1);
 }
